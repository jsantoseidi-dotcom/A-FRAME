<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Tracking - MindAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Quadrado 1 -->
        <a-box color="red" position="-0.35 0 0" scale="0.25 0.25 0.25"></a-box>

        <!-- Quadrado 2 -->
        <a-box color="blue" position="0.35 0 0" scale="0.25 0.25 0.25"></a-box>

        <!-- Triângulo -->
        <a-entity id="triangle" position="0 0.4 0" scale="0.8 0.8 0.8"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent("triangle-shape", {
        init: function () {
          const geometry = new THREE.BufferGeometry();

          const vertices = new Float32Array([
            0.0, 0.35, 0.0,   // topo
            -0.35, -0.35, 0.0, // esquerda
            0.35, -0.35, 0.0   // direita
          ]);

          geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
          geometry.setIndex([0, 1, 2]);
          geometry.computeVertexNormals();

          const material = new THREE.MeshStandardMaterial({
            color: "#00ff88",
            side: THREE.DoubleSide
          });

          const mesh = new THREE.Mesh(geometry, material);
          this.el.setObject3D("mesh", mesh);
        }
      });

      const tri = document.getElementById("triangle");
      tri.setAttribute("triangle-shape", "");
    </script>
  </body>
</html>

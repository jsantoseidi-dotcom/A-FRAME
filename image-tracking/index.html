<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi Image Tracking</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-box color="#ff0000" scale="0.6 0.6 0.6"></a-box>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-sphere color="#00ff00" radius="0.25"></a-sphere>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-cylinder color="#0000ff" height="0.8" radius="0.2"></a-cylinder>
      </a-entity>
    </a-scene>
  </body>
</html>
